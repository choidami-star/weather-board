<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>현장 일정 날씨판</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>현장 일정 날씨판</h1>
    <p class="sub"><time datetime="2026-10-27">2026-10-27</time></p>
    <p class="sub">오늘 현장 점검 · 야외 행사 · 시설 보수 일정 (교육용 가상 데이터)</p>
  </header>

  <section class="card weather-panel" aria-label="가상 날씨 안내">
    <h2>지역별 날씨 <span class="demo-label">가상 데이터</span></h2>
    <p id="weatherBox" role="status">가상 날씨를 불러오는 중입니다.</p>
    <p class="weather-help">최고 기온 / 최대 풍속 / 강수확률 · 교육용 가상 기준입니다.</p>
    <div class="legend" aria-label="판단 배지 안내">
      <span class="badge badge-ok">정상 진행</span>
      <span class="badge badge-wind">강풍 주의</span>
      <span class="badge badge-rain">우천 대비 필요</span>
      <span class="badge badge-none">날씨 확인 전</span>
    </div>
  </section>

  <section class="card">
    <h2>오늘 일정</h2>
    <table>
      <thead><tr><th>일정</th><th>지역</th><th>구분</th><th>담당</th><th>날씨</th><th>판단</th></tr></thead>
      <tbody id="taskList"></tbody>
    </table>
  </section>

  <section class="card">
    <h2>일정 추가</h2>
    <form id="taskForm">
      <label>일정 이름<input id="titleInput" placeholder="가상 일정 이름" required></label>
      <label>지역<select id="regionInput"><option>세종</option><option>대전</option><option>태안</option><option>보령</option></select></label>
      <label>구분<select id="kindInput"><option>야외</option><option>고소</option><option>실내</option></select></label>
      <label>담당<input id="ownerInput" placeholder="가상 담당자" required></label>
      <button>추가</button>
    </form>
    <p id="msgBox"></p>
  </section>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
